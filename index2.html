<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Подарки</title>
<style>
body { font-family: sans-serif; margin: 20px; background: #121212; color: #eee; }
h1 { text-align: center; margin-bottom: 20px; }
.gifts-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
.gift-card { position: relative; width: 150px; cursor: pointer; border-radius: 12px; overflow: hidden; background: #1f1f1f; transition: 0.2s; }
.gift-card:hover { filter: brightness(1.1); }
.gift-card img { width: 100%; height: 100%; object-fit: contain; }
.ribbon { position: absolute; top: 5px; right: -20px; width: 70px; height: 25px; background: linear-gradient(45deg, #a980f3, #5b62d8); transform: rotate(45deg); color: white; font-size: 10px; font-weight: 500; text-align: center; line-height: 25px; }
.copy-btn { position: absolute; bottom: 5px; right: 5px; background: #333; border: none; color: #fff; font-size: 12px; padding: 2px 5px; cursor: pointer; border-radius: 3px; }
.unlock-time { font-weight: bold; font-size: 12px; margin-top: 2px; text-align: center; }
.unlock-red { color: red; }
.unlock-orange { color: orange; }
.unlock-green { color: lightgreen; }
.unlock-blue { color: #00f0ff; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
.modal-content { background: #222; padding: 20px; border-radius: 10px; color: #eee; max-width: 400px; text-align: center; }
.modal-close { cursor: pointer; margin-top: 10px; background: #555; border: none; padding: 5px 10px; border-radius: 5px; color: #fff; }
</style>
</head>
<body>

<h1>Подарки</h1>
<div class="gifts-container" id="giftsContainer"></div>

<div class="modal" id="giftModal">
  <div class="modal-content" id="modalContent">
    <h2 id="modalTitle"></h2>
    <img id="modalImg" src="" style="width: 200px; margin: 10px 0;">
    <p id="modalModel"></p>
    <p id="modalBackground"></p>
    <p id="modalPattern"></p>
    <a id="modalLink" href="#" target="_blank">Ссылка на подарок</a>
    <br>
    <button class="modal-close" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script>
const JSON_URL = 'https://ideatg-ideatg.amvera.io/all_gifts.json';
const giftsContainer = document.getElementById('giftsContainer');
const modal = document.getElementById('giftModal');
const modalTitle = document.getElementById('modalTitle');
const modalImg = document.getElementById('modalImg');
const modalModel = document.getElementById('modalModel');
const modalBackground = document.getElementById('modalBackground');
const modalPattern = document.getElementById('modalPattern');
const modalLink = document.getElementById('modalLink');

function calculateUnlockColor(daysLeft) {
    if (daysLeft >= 16) return 'unlock-red';
    if (daysLeft >= 5) return 'unlock-orange';
    if (daysLeft >= 1) return 'unlock-green';
    return 'unlock-blue';
}

function daysBetween(date1, date2) {
    return Math.ceil((date2 - date1)/(1000*60*60*24));
}

function createGiftCard(g) {
    const card = document.createElement('div');
    card.className = 'gift-card';

    // картинка
    const img = document.createElement('img');
    img.src = `https://nft.fragment.com/gift/${g.gift_name}-${g.gift_id}.medium.jpg`;
    img.alt = `${g.gift_name} #${g.gift_id}`;
    card.appendChild(img);

    // ленточка с номером
    const ribbon = document.createElement('div');
    ribbon.className = 'ribbon';
    ribbon.textContent = `#${g.gift_id}`;
    card.appendChild(ribbon);

    // кнопка копировать ссылку
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = '📋';
    copyBtn.onclick = (e) => { 
        e.stopPropagation();
        navigator.clipboard.writeText(`https://t.me/nft/${g.gift_name}-${g.gift_id}`);
        alert('Ссылка скопирована!');
    }
    card.appendChild(copyBtn);

    // информация о разлоке
    const parseDateParts = g.parse_date.split('.'); // dd.mm.yyyy
    const parseDate = new Date(`${parseDateParts[2]}-${parseDateParts[1]}-${parseDateParts[0]}T00:00:00`);
    const unlockDate = new Date(parseDate);
    unlockDate.setDate(parseDate.getDate() + 21);
    const daysLeft = daysBetween(new Date(), unlockDate);
    const unlockSpan = document.createElement('div');
    unlockSpan.className = 'unlock-time ' + calculateUnlockColor(daysLeft);
    unlockSpan.textContent = `Разлок через: ${daysLeft} дней`;
    card.appendChild(unlockSpan);

    // клик открывает модал
    card.onclick = () => {
        modalTitle.textContent = `${g.gift_name} #${g.gift_id}`;
        modalImg.src = img.src;
        modalModel.textContent = `Model: ${g.model || '-'}`;
        modalBackground.textContent = `Background: ${g.background || '-'}`;
        modalPattern.textContent = `Pattern: ${g.pattern || '-'}`;
        modalLink.href = `https://t.me/nft/${g.gift_name}-${g.gift_id}`;
        modal.style.display = 'flex';
    }

    return card;
}

function closeModal() { modal.style.display = 'none'; }

async function loadGifts() {
    try {
        const resp = await fetch(JSON_URL);
        const gifts = await resp.json();
        gifts.forEach(g => giftsContainer.appendChild(createGiftCard(g)));
    } catch(e) {
        console.error("Ошибка загрузки JSON:", e);
    }
}

loadGifts();
</script>

</body>
</html>
