<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web3 NFT Gifts</title>
<style>
  /* === Общие стили === */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Orbitron', sans-serif;
    background: #000 url('https://i.ibb.co/2cLPR1R/rain-bg.gif') center center / cover no-repeat;
    color: #d8d8ff;
  }
  h1 {
    text-align: center;
    margin-top: 20px;
    font-size: 2em;
    letter-spacing: 2px;
  }

  /* === Контейнер и поиск === */
  .container {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
  }
  .search-box {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
    gap: 10px;
  }
  .search-box input, .search-box select {
    padding: 8px 12px;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    outline: none;
  }
  .search-box input::placeholder { color: #aaa; }
  .search-box button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #5b62d8;
    color: #fff;
    cursor: pointer;
    transition: 0.2s;
  }
  .search-box button:hover {
    background: #a980f3;
  }

  /* === Сетка подарков === */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
  }
  .gift-card {
    background: rgba(40, 40, 40, 0.7);
    border-radius: 20px;
    padding: 10px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, filter 0.2s;
  }
  .gift-card:hover {
    transform: translateY(-5px);
    filter: brightness(1.2);
  }

  /* === Изображение подарка и ленточка === */
  .gift-card img {
    width: 100%;
    border-radius: 16px;
    object-fit: contain;
  }
  .ribbon {
    position: absolute;
    top: 10px;
    right: -10px;
    width: 70px;
    height: 70px;
    background: linear-gradient(45deg, #a980f3, #5b62d8);
    clip-path: polygon(0 0, 100% 0, 100% 50%, 50% 100%, 0 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: bold;
    font-size: 0.9em;
    pointer-events: none;
  }

  /* === Информация о подарке === */
  .gift-info {
    margin-top: 8px;
    text-align: center;
    font-size: 0.9rem;
  }
  .unlock-date {
    font-weight: bold;
  }
  .copy-link {
    margin-top: 5px;
    padding: 4px 8px;
    border: none;
    border-radius: 8px;
    background: #5b62d8;
    color: #fff;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .copy-link:hover { background: #a980f3; }
</style>
</head>
<body>

<h1>🎁 Web3 NFT Gifts</h1>

<div class="container">
  <div class="search-box">
    <select id="giftSelect">
      <option value="">Все подарки</option>
    </select>
    <input type="number" id="giftNumber" placeholder="Найти по номеру">
    <button onclick="searchGifts()">Поиск</button>
  </div>
  <div id="foundCount" style="text-align:center;margin-bottom:10px;"></div>
  <div class="grid" id="giftsGrid"></div>
</div>

<script>
const GIFTS_TYPES = [
  "LunarSnake","CandyCane","SnowGlobe","SkullFlower","WinterWreath","XmasStocking",
  "HolidayDrink","LootBag","SwagBag","SnowMittens","PetSnake","GenieLamp","DiamondRing",
  "SpicedWine","JesterHat","TopHat","JoyfulBundle","SnakeBox","SnoopDogg","BunnyMuffin",
  "TamaGadget","LovePotion","EternalCandle","CupidCharm","NailBracelet","VoodooDoll",
  "JackInTheBox","HexPot","BDayCandle","LushBouquet","GingerCookie","BigYear","JingleBells",
  "WitchHat","SignetRing","BowTie","SnoopCigar","JellyBunny","ToyBear","NekoHelmet",
  "ElectricSkull","CrystalBall","LolPop","SantaHat","HomemadeCake","KissedFrog","LightSword",
  "CookieHeart","HypnoLollipop","PartySparkler","BondedRing","VintageCigar","EvilEye",
  "DeskCalendar","TrappedHeart","MadPumpkin","HangingStar","WhipCupcake","StarNotepad",
  "SakuraFlower","RestlessJar","FlyingBroom","SwissWatch","LowRider","SharpTongue",
  "StellarRocket","Moonpendant","EasterEgg","BerryBox","RecordPlayer","JollyChimp",
  "IonicDryer","EternalRose","LoveCandle","ValentineBox","InputKey","SpringBasket",
  "InstantRamen","MousseCake","IceCream","HappyBrownie","FreshSocks","CloverPin",
  "BlingBinky","KhabibsPapakha","FaithAmulet","MoneyPot","HeroicHelmet","PreciousPeach",
  "Westsidesign","HeartLocket","ScaredCat","IonGem","PlushPepe","PerfumeBottle",
  "AstralShard","MiniOscar","DurovsCap","MagicPotion","SleighBell","VictoryMedal",
  "UFCStrike","PrettyPosy"
];

const giftSelect = document.getElementById("giftSelect");
GIFTS_TYPES.forEach(g => {
  const opt = document.createElement("option");
  opt.value = g;
  opt.textContent = g;
  giftSelect.appendChild(opt);
});

let allGifts = [];

async function loadGifts() {
  try {
    const res = await fetch('/all_gifts.json');
    allGifts = await res.json();
    displayGifts(allGifts);
  } catch(e) {
    console.error("Ошибка загрузки JSON:", e);
  }
}

function displayGifts(gifts) {
  const grid = document.getElementById("giftsGrid");
  grid.innerHTML = '';
  gifts.forEach(g => {
    const now = new Date();
    const sendDate = new Date(g.scheduled_send_date.split('.').reverse().join('-'));
    let diff = Math.ceil((sendDate - now) / (1000*60*60*24));

    let color = '#fff';
    if(diff >= 16) color = 'red';
    else if(diff >= 5) color = 'orange';
    else if(diff >= 1) color = 'green';
    else color = 'deepskyblue';

    const card = document.createElement('div');
    card.className = 'gift-card';
    card.innerHTML = `
      <img src="https://nft.fragment.com/gift/${g.gift_name}-${g.gift_id}.medium.jpg" alt="${g.gift_name} #${g.gift_id}">
      <div class="ribbon">#${g.gift_id}</div>
      <div class="gift-info">
        <div>${g.gift_name}</div>
        <div class="unlock-date" style="color:${color}">Разлок через: ${diff} дн.</div>
        <button class="copy-link" onclick="copyLink('${g.url}')">Скопировать ссылку</button>
      </div>
    `;
    grid.appendChild(card);
  });
  document.getElementById('foundCount').textContent = `Найдено: ${gifts.length} подарков`;
}

function copyLink(url) {
  navigator.clipboard.writeText(url);
  alert("Ссылка скопирована!");
}

function searchGifts() {
  const name = giftSelect.value;
  const number = document.getElementById("giftNumber").value;
  let filtered = allGifts;

  if(name) filtered = filtered.filter(g => g.gift_name === name);
  if(number) filtered = filtered.filter(g => g.gift_id == number);

  displayGifts(filtered);
}

window.onload = loadGifts;
</script>

</body>
</html>
