<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Escrow | Mini App</title>
    <!-- Modern font for clean error/maintenance look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #0B0E18, #02040A);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        /* ---- CINEMATIC RAIN (canvas) ---- */
        #rain-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.72;
            will-change: transform;
        }

        /* ---- GLOBAL INTERACTION BLOCKER (NO CLICKS ANYWHERE) ---- */
        .click-blocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: default;
            pointer-events: all;
            touch-action: none;
        }

        /* ---- MAIN ERROR/MAINTENANCE CARD (fully static, no interactivity) ---- */
        .error-card {
            position: relative;
            z-index: 20;
            max-width: 560px;
            width: 90%;
            margin: 0 auto;
            background: rgba(8, 12, 24, 0.65);
            backdrop-filter: blur(24px);
            border-radius: 68px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            animation: fadeUp 0.85s cubic-bezier(0.2, 0.95, 0.3, 1.05) forwards;
            pointer-events: none;       /* fully inert */
        }

        .card-inner {
            padding: 48px 28px 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Sticker wrapper — GIF looks like native animation */
        .sticker-wrapper {
            width: 270px;
            height: 270px;
            margin: 12px 0 24px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-radius: 48px;
        }

        .sticker-gif {
            width: 260px;
            height: 260px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.5));
            pointer-events: none;
            image-rendering: crisp-edges;
        }

        /* Error / maintenance heading */
        .error-code {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1.2px;
            color: rgba(170, 190, 255, 0.55);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .main-message {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(125deg, #FFFFFF, #B2CEFF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 14px;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 17px;
            line-height: 1.5;
            color: rgba(200, 215, 245, 0.85);
            font-weight: 470;
            max-width: 330px;
            margin: 0 auto;
        }

        .sub-note {
            margin-top: 24px;
            font-size: 13px;
            font-weight: 400;
            color: rgba(140, 165, 215, 0.6);
            letter-spacing: 0.2px;
        }

        /* decorative minimalist line */
        .grace-line {
            width: 48px;
            height: 2px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            margin: 28px auto 0;
        }

        /* Animations */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(28px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 560px) {
            .card-inner {
                padding: 36px 20px 44px;
            }
            .sticker-wrapper {
                width: 220px;
                height: 220px;
            }
            .sticker-gif {
                width: 210px;
                height: 210px;
            }
            .main-message {
                font-size: 28px;
            }
            .description {
                font-size: 15px;
            }
        }
        @media (max-width: 450px) {
            .sticker-wrapper {
                width: 190px;
                height: 190px;
            }
            .sticker-gif {
                width: 180px;
                height: 180px;
            }
        }

        /* hide any outlines or potential UI glitches */
        :focus {
            outline: none;
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 100% CLICK BLOCKER — prevents ANY interaction (no buttons, no taps) -->
    <div class="click-blocker" aria-hidden="true"></div>

    <!-- RAIN BACKGROUND (advanced animated weather effect) -->
    <canvas id="rain-canvas"></canvas>

    <!-- MAINTENANCE CARD (PURE VISUAL, NO CLICKABLE ELEMENTS) -->
    <div class="error-card">
        <div class="card-inner">
            <!-- subtle error indicator (no "temporary" badge) -->
            <div class="error-code">⚠️</div>

            <!-- Main heading: classic maintenance / error vibe -->
            <h1 class="main-message">We'll be back</h1>
            <div class="description">
                Something went wrong on our end.<br>
                We're working hard to restore full access.
            </div>

            <!-- GIF STICKER: replace 'sticker.gif' with your file -->
            <div class="sticker-wrapper">
                <img class="sticker-gif" src="sticker.gif" alt="" draggable="false">
            </div>

            <!-- subtle line + note (just aesthetic) -->
            <div class="grace-line"></div>
            <div class="sub-note">
                escrow · deal systems
            </div>
        </div>
    </div>

    <script>
        (function() {
            // --------------------------------------------------------------
            // 1. ADVANCED RAIN (realistic, high performance)
            // --------------------------------------------------------------
            const canvas = document.getElementById('rain-canvas');
            let ctx = canvas.getContext('2d');
            let width, height;
            let rainDrops = [];
            const DROP_COUNT = 300;      // rich rainfall effect
            const WIND = 0.62;

            function initRain() {
                rainDrops = [];
                for (let i = 0; i < DROP_COUNT; i++) {
                    rainDrops.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        length: 6 + Math.random() * 15,
                        speed: 8 + Math.random() * 16,
                        opacity: 0.3 + Math.random() * 0.6,
                        thickness: 0.8 + Math.random() * 1.4,
                        sway: (Math.random() - 0.5) * 1.2
                    });
                }
            }

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                initRain();
            }

            function drawRain() {
                if (!ctx) return;
                ctx.clearRect(0, 0, width, height);
                // subtle dark atmospheric overlay
                ctx.fillStyle = "rgba(2, 5, 14, 0.12)";
                ctx.fillRect(0, 0, width, height);
                
                for (let i = 0; i < rainDrops.length; i++) {
                    const drop = rainDrops[i];
                    ctx.beginPath();
                    const startX = drop.x;
                    const startY = drop.y;
                    const endX = startX + (WIND * 1.2) + drop.sway * 0.45;
                    const endY = startY + drop.length;
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.lineWidth = drop.thickness;
                    ctx.strokeStyle = `rgba(165, 205, 255, ${drop.opacity * 0.72})`;
                    ctx.stroke();
                    
                    // extra gleam on certain rain streaks
                    if (i % 6 === 0) {
                        ctx.beginPath();
                        ctx.moveTo(startX - 0.7, startY);
                        ctx.lineTo(endX - 1.0, endY);
                        ctx.lineWidth = drop.thickness * 0.45;
                        ctx.strokeStyle = `rgba(255, 250, 215, ${drop.opacity * 0.35})`;
                        ctx.stroke();
                    }
                    
                    // update position
                    drop.y += drop.speed;
                    drop.x += (WIND * 0.4) + (drop.sway * 0.18);
                    
                    // reset when off screen
                    if (drop.y > height + 70 || drop.x < -80 || drop.x > width + 100) {
                        drop.y = -Math.random() * 55 - 20;
                        drop.x = Math.random() * width;
                        drop.speed = 7 + Math.random() * 18;
                        drop.length = 5 + Math.random() * 15;
                        drop.opacity = 0.25 + Math.random() * 0.65;
                    }
                    if (drop.x > width + 120) drop.x = -40;
                    if (drop.x < -120) drop.x = width + 60;
                }
                requestAnimationFrame(drawRain);
            }
            
            window.addEventListener('resize', () => {
                resizeCanvas();
            });
            resizeCanvas();
            drawRain();

            // --------------------------------------------------------------
            // 2. GIF HANDLER: make it invisible that it's a GIF + fallback
            // --------------------------------------------------------------
            const gifImg = document.querySelector('.sticker-gif');
            if (gifImg) {
                // kill any possible interaction / context menu / drag on gif
                gifImg.addEventListener('contextmenu', (e) => e.preventDefault());
                gifImg.addEventListener('dragstart', (e) => e.preventDefault());
                gifImg.style.pointerEvents = 'none';
                gifImg.setAttribute('draggable', 'false');
                gifImg.setAttribute('alt', '');
                
                // fallback in case sticker.gif is missing (still shows a smooth placeholder)
                gifImg.onerror = function() {
                    const parentContainer = document.querySelector('.sticker-wrapper');
                    if (parentContainer && gifImg) {
                        gifImg.style.display = 'none';
                        const fallbackCanvas = document.createElement('canvas');
                        fallbackCanvas.width = 240;
                        fallbackCanvas.height = 240;
                        fallbackCanvas.style.width = '240px';
                        fallbackCanvas.style.height = '240px';
                        fallbackCanvas.style.display = 'block';
                        fallbackCanvas.style.margin = '0 auto';
                        fallbackCanvas.style.filter = 'drop-shadow(0 6px 14px rgba(0,0,0,0.4))';
                        const pCtx = fallbackCanvas.getContext('2d');
                        pCtx.fillStyle = "#0F1428";
                        pCtx.fillRect(0, 0, 240, 240);
                        pCtx.font = "70px 'Inter', system-ui";
                        pCtx.textAlign = "center";
                        pCtx.textBaseline = "middle";
                        pCtx.fillStyle = "#FEDB83";
                        pCtx.fillText("🔨", 120, 100);
                        pCtx.font = "48px 'Inter'";
                        pCtx.fillStyle = "#FFD966";
                        pCtx.fillText("🦆", 120, 160);
                        parentContainer.appendChild(fallbackCanvas);
                    }
                };
            }

            // --------------------------------------------------------------
            // 3. FULL PAGE INTERACTION LOCK (no clicks anywhere)
            // --------------------------------------------------------------
            const blocker = document.querySelector('.click-blocker');
            if (blocker) {
                blocker.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); return false; });
                blocker.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); }, { passive: false });
                blocker.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); });
                blocker.addEventListener('mousedown', (e) => { e.preventDefault(); e.stopPropagation(); });
                blocker.addEventListener('mouseup', (e) => e.preventDefault());
            }
            
            // extra insurance: global event capture to kill all clicks & touches
            document.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
            document.addEventListener('touchstart', function(e) { e.preventDefault(); e.stopPropagation(); }, { passive: false, capture: true });
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
            
            // disable all scrolling & zooming (essential for mini-app)
            document.body.style.overflow = 'hidden';
            document.documentElement.style.overflow = 'hidden';
            document.body.style.touchAction = 'none';
            document.documentElement.style.touchAction = 'none';
            
            // disable keyboard shortcuts (F5, F12, Space, etc.)
            window.addEventListener('keydown', function(e) {
                const blocked = ['F5', 'F12', 'Escape', ' ', 'Space', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
                if (blocked.includes(e.key) || e.keyCode === 116 || e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    return false;
                }
                e.preventDefault();
            }, true);
            
            // make every single element non-clickable just in case
            const allInteractive = document.querySelectorAll('*');
            allInteractive.forEach(el => {
                el.style.pointerEvents = 'none';
            });
            // but ensure rain canvas stays pointer-events: none (already fine)
            if (canvas) canvas.style.pointerEvents = 'none';
            
            // lock scrolling position to top
            window.scrollTo(0, 0);
            
            // Telegram WebApp support: expand & disable swipes (no visual UI changes)
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    const tg = window.Telegram.WebApp;
                    tg.expand();
                    tg.disableVerticalSwipes();
                    tg.ready();
                } catch(e) {}
            }
            
            console.log("Maintenance mode — no clickable elements, pure error screen with GIF + rain");
        })();
    </script>
</body>
</html>
